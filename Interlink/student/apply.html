<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apply Now | Campus Portal</title>

    <style>
      :root {
        /* ===== InternLink theme tokens ===== */
        --sidebar-dark: #062b1b;
        --sidebar-hover: #0b3d26;
        --sidebar-active: #26734d;

        --page-bg: #f7f9f6;
        --white: #ffffff;

        --hero-bg: #eef7f1;
        --hero-border: #dcebe1;

        --card-green: #e8f5ec;
        --card-blue: #eaf4fa;

        --gold: #d4af37;
        --gold-light: #f5d76e;

        --text-dark: #0d2b1d;
        --text-muted: #5b6b62;
        --error: #d64545;
        --success: #1e8e5a;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
        color: var(--text-dark);
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--page-bg);
        padding: 30px 15px;
      }

      /* Main Container */
      .container {
        max-width: 95%;
        width: 1100px;
        min-height: 700px;
        display: flex;
        background: var(--white);
        border-radius: 25px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(6, 43, 27, 0.12);
        border: 1px solid var(--hero-border);
      }

      /* Left Panel */
      .brand {
        width: 38%;
        background:
          linear-gradient(rgba(6, 43, 27, 0.88), rgba(6, 43, 27, 0.88)),
          url("https://images.unsplash.com/photo-1523050854058-8df90110c9f1");
        background-size: cover;
        background-position: center;
        padding: 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .logo {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, var(--gold), var(--gold-light));
        color: var(--sidebar-dark);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 30px;
      }

      .brand h1 {
        font-size: 40px;
        color: var(--gold);
        margin-bottom: 20px;
      }

      .brand p {
        color: #e6efe9;
        font-size: 17px;
        line-height: 1.7;
      }

      /* Application Section */
      .apply-box {
        width: 62%;
        padding: 40px 50px;
        overflow-y: auto;
        background: var(--white);
      }

      .apply-box h2 {
        text-align: center;
        color: var(--sidebar-dark);
        font-size: 32px;
        margin-bottom: 6px;
      }

      .apply-box .subtitle {
        text-align: center;
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 25px;
      }

      .form-row {
        display: flex;
        gap: 20px;
      }

      .input-group {
        width: 100%;
        margin-bottom: 16px;
      }

      .input-group label {
        display: block;
        margin-bottom: 7px;
        color: var(--text-dark);
        font-size: 14px;
        font-weight: 600;
      }

      .input-group input,
      .input-group select,
      .input-group textarea {
        display: block;
        width: 100%;
        padding: 12px 15px;
        background: var(--card-green);
        border: 1px solid var(--hero-border);
        border-radius: 10px;
        outline: none;
        color: var(--text-dark);
        font-size: 15px;
        transition: 0.2s;
      }

      .input-group select {
        background: var(--card-blue);
      }

      .input-group input::placeholder,
      .input-group textarea::placeholder {
        color: var(--text-muted);
      }

      .input-group textarea {
        resize: none;
        height: 90px;
      }

      .input-group input:focus,
      .input-group select:focus,
      .input-group textarea:focus {
        border-color: var(--gold);
        background: var(--white);
        box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
      }

      /* File Upload */
      input[type="file"] {
        padding: 10px;
        background: var(--card-green);
      }

      /* Checkbox */
      .checkbox {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 15px 0;
        color: var(--text-dark);
        font-size: 14px;
      }

      .checkbox input {
        width: 18px;
        height: 18px;
        accent-color: var(--gold);
      }

      /* Submit Button */
      button {
        display: block;
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--gold), var(--gold-light));
        color: var(--sidebar-dark);
        font-size: 17px;
        font-weight: bold;
        text-align: center;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(212, 175, 55, 0.35);
      }

      .error {
        color: var(--error);
        font-size: 13px;
        margin-top: 5px;
      }

      .success {
        text-align: center;
        color: var(--success);
        margin-top: 15px;
        font-size: 15px;
        font-weight: 600;
      }

      .back-link {
        text-align: center;
        margin-top: 18px;
      }

      .back-link a {
        color: var(--sidebar-active);
        text-decoration: none;
        font-weight: bold;
      }

      /* Responsive */
      @media (max-width: 850px) {
        .container {
          flex-direction: column;
        }

        .brand {
          width: 100%;
          min-height: 260px;
        }

        .apply-box {
          width: 100%;
          padding: 35px;
        }

        .form-row {
          flex-direction: column;
          gap: 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Branding Panel -->
      <div class="brand">
        <div class="logo">CP</div>
        <h1>Campus Portal</h1>
        <p>
          Submit your application and join our campus community with access to
          academic opportunities and resources.
        </p>
      </div>

      <!-- Application Form -->
      <div class="apply-box">
        <h2>Application Form</h2>
        <div class="subtitle">Apply through InternLink's Campus Portal</div>

        <form id="applyForm">
          <div class="form-row">
            <div class="input-group">
              <label>Student Name</label>
              <input type="text" id="name" placeholder="Enter your full name" />
              <div class="error" id="nameError"></div>
            </div>

            <div class="input-group">
              <label>USN</label>
              <input type="text" id="usn" placeholder="Enter your USN" />
              <div class="error" id="usnError"></div>
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label>College Email</label>
              <input
                type="email"
                id="email"
                placeholder="Enter your college email"
              />
              <div class="error" id="emailError"></div>
            </div>

            <div class="input-group">
              <label>Phone Number</label>
              <input type="tel" id="phone" placeholder="Enter phone number" />
              <div class="error" id="phoneError"></div>
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label>Department</label>
              <select id="department">
                <option value="">Select Department</option>
                <option>Computer Science</option>
                <option>Information Science</option>
                <option>Electronics</option>
                <option>Mechanical</option>
                <option>Civil</option>
              </select>
              <div class="error" id="deptError"></div>
            </div>

            <div class="input-group">
              <label>Year</label>
              <select id="year">
                <option value="">Select Year</option>
                <option>1st Year</option>
                <option>2nd Year</option>
                <option>3rd Year</option>
                <option>4th Year</option>
              </select>
              <div class="error" id="yearError"></div>
            </div>
          </div>

          <div class="input-group">
            <label>Select Program</label>
            <select id="program">
              <option value="">Choose Program</option>
              <option>Internship Application</option>
              <option>Scholarship Application</option>
              <option>Placement Application</option>
              <option>Campus Event Registration</option>
            </select>
            <div class="error" id="programError"></div>
          </div>

          <div class="input-group">
            <label>Upload Resume</label>
            <input type="file" id="resume" accept=".pdf,.doc,.docx" />
            <div class="error" id="resumeError"></div>
          </div>

          <div class="input-group">
            <label>Address</label>
            <textarea id="address" placeholder="Enter your address"></textarea>
            <div class="error" id="addressError"></div>
          </div>

          <div class="input-group">
            <label>Statement of Purpose</label>
            <textarea
              id="message"
              placeholder="Why are you applying?"
            ></textarea>
            <div class="error" id="messageError"></div>
          </div>

          <div class="checkbox">
            <input type="checkbox" id="terms" />
            <label for="terms">
              I confirm that the information provided is correct.
            </label>
          </div>

          <div class="error" id="termsError"></div>

          <button type="submit">Submit Application</button>

          <div class="success" id="successMessage"></div>

          <div class="back-link">
            <button onclick="goHome()">Back To Home</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      function goHome() {
        window.location.href = "dashboard.html";
      }

      const form = document.getElementById("applyForm");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        let valid = true;

        document.querySelectorAll(".error").forEach(function (error) {
          error.innerHTML = "";
        });

        document.getElementById("successMessage").innerHTML = "";

        const name = document.getElementById("name").value.trim();
        const usn = document.getElementById("usn").value.trim();
        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const department = document.getElementById("department").value;
        const year = document.getElementById("year").value;
        const program = document.getElementById("program").value;
        const resume = document.getElementById("resume").value;
        const address = document.getElementById("address").value.trim();
        const message = document.getElementById("message").value.trim();
        const terms = document.getElementById("terms").checked;

        if (name === "") {
          document.getElementById("nameError").innerHTML = "Enter your name";
          valid = false;
        }

        if (usn === "") {
          document.getElementById("usnError").innerHTML = "Enter your USN";
          valid = false;
        }

        if (email === "" || !email.includes("@")) {
          document.getElementById("emailError").innerHTML =
            "Enter a valid email";
          valid = false;
        }

        if (!/^\d{10,15}$/.test(phone)) {
          document.getElementById("phoneError").innerHTML =
            "Enter a valid phone number (digits only)";
          valid = false;
        }

        if (department === "") {
          document.getElementById("deptError").innerHTML = "Select department";
          valid = false;
        }

        if (year === "") {
          document.getElementById("yearError").innerHTML = "Select year";
          valid = false;
        }

        if (program === "") {
          document.getElementById("programError").innerHTML = "Select program";
          valid = false;
        }

        if (resume === "") {
          document.getElementById("resumeError").innerHTML = "Upload resume";
          valid = false;
        }

        if (address === "") {
          document.getElementById("addressError").innerHTML =
            "Enter your address";
          valid = false;
        }

        if (message === "") {
          document.getElementById("messageError").innerHTML =
            "Enter statement of purpose";
          valid = false;
        }

        if (!terms) {
          document.getElementById("termsError").innerHTML =
            "Accept the confirmation";
          valid = false;
        }

        if (valid) {
          document.getElementById("successMessage").innerHTML =
            "Application submitted successfully!";
          form.reset();
        }
      });
    </script>
  </body>
</html>
